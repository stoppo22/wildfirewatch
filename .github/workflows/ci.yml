name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m black --check .

      - name: Run tests
        run: python -m pytest

      - name: Run reproducible benchmark
        run: python -m scripts.run_pipeline_benchmark

      - name: Verify packaged web assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/wildfirewatch-wheel
          test "$(unzip -Z1 /tmp/wildfirewatch-wheel/*.whl | grep -Ec '^wildfirewatch/web/(index.html|styles.css|app.js)$')" -eq 3
