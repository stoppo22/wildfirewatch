[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfirewatch"
version = "0.7.0"
description = "Track and evaluate candidate fire events from NASA FIRMS detections"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.7,<2",
    "fastapi>=0.141,<1",
    "matplotlib>=3.8,<4",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "black~=26.0",
    "httpx2>=2.12,<3",
    "pytest>=8",
]

[tool.setuptools]
packages = ["wildfirewatch"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
