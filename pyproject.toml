[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfirewatch"
version = "0.3.0"
description = "Learning-first processing of NASA FIRMS active-fire detections"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "black~=26.0",
    "pytest>=8",
]

[tool.setuptools]
packages = ["wildfirewatch"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
